name: Post AI News

on:
  schedule:
    # Hourly, 06:00-22:00 UTC. This is a superset of 08:00-23:00 Europe/Berlin
    # local time across both CET (UTC+1) and CEST (UTC+2) - main.py's
    # zoneinfo-based check (config.POSTING_TIMEZONE) does the precise,
    # DST-correct daytime gating and skips any run outside that window.
    - cron: "0 6-22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the daytime posting window (for manual testing)"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_FARSI_BOT_TOKEN: ${{ secrets.TELEGRAM_FARSI_BOT_TOKEN }}
          TELEGRAM_FARSI_CHANNEL_ID: ${{ secrets.TELEGRAM_FARSI_CHANNEL_ID }}
          TELEGRAM_FARSI_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_FARSI_CHANNEL_USERNAME }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python main.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit updated post history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_history.json
          git diff --quiet --cached || git commit -m "Update post history [skip ci]"
          git push
